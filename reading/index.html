/* Shared sky-blue palette and literary type with the main blog. */
:root{--paper:#dceef9;--card:#f8fcff;--ink:#344f63;--green:#3c6680;--muted:#637f92;--line:#bcd6e7;--gold:#709ab5;--serif:'Shiyi WenKai','STKaiti','KaiTi','Songti SC','SimSun',serif;--art:var(--serif)}
body{background:radial-gradient(ellipse at 20% 0,#eef9ff 0,transparent 55%),var(--paper);font-family:var(--serif);font-size:17px}
::selection{background:#bfdff3;color:#294c66}
.brand{font-size:24px;letter-spacing:3px;color:#3c6680}.brand-mark{border-color:#779eb7;font-size:24px}

.hero h1{color:#365c77}.hero-desc{color:#647f92}.eyebrow{color:#60839b;font-family:Georgia,serif}.hero-art{color:#7898ad}.seal{border-color:#83a8bf;color:#7398b1}
.manager{background:#e8f4fc;border-color:#bad5e7}.manager p,.manager-foot{color:#5c7c93}.btn:hover{border-color:#8eafc5;background:#edf6fc}.btn.primary:hover{background:#2c5673}.demo{border-color:#adc9dd;color:#607e94;background:#eff7fc}
.book-button{color:#607c93}.book-button:hover{background:#edf7fd}.book-button.selected{border-color:#b8d3e5;background:#deeff9;color:#345e7a}.shelf-note{color:#668399}
.search-box input::placeholder{color:#6f8a9e}.filters select{color:#54748c}.content-title h2{color:#365d77}.link-button{border-color:#8eafc5}
.cards{border-color:#c0d8e8;box-shadow:0 5px 20px rgba(56,94,121,.035)}.quote-card{border-bottom-color:#d2e3ef}.quote-card:hover{background:#edf7fc}.quote-card:target{background:#e7f3fb;box-shadow:inset 3px 0 0 var(--gold)}
.card-top,.card-index{color:#6c90aa}.chapter{font-size:12px}.quote-card blockquote{color:#344f63;letter-spacing:.3px}.attribution{color:#607b8e}.attribution .dot{color:#8cabbf}.card-bottom,.source,.icon-button{color:#658499;font-size:12px}.source.hot{color:#7586a4}.note{color:#54768e}

  <div class="wrap">
    <header class="top">
      <a class="brand" href="https://ki11yy.github.io/"><span class="brand-mark" aria-hidden="true">忆</span>拾忆碎笔</a>
      <nav class="top-links" aria-label="网站导航"><a href="https://ki11yy.github.io/">首页</a><a href="https://ki11yy.github.io/about/">关于</a><a href="https://ki11yy.github.io/tags/">标签</a><a href="https://ki11yy.github.io/categories/">分类</a><a href="https://ki11yy.github.io/archives/">归档</a><span class="active-link" aria-current="page">阅读卡片</span></nav>
    </header>
    <section class="hero" aria-labelledby="page-title">
      <div><p class="eyebrow">READING NOTES / 阅读的留白</p><h1 id="page-title">阅读卡片</h1><p class="hero-desc">把读过的书，留在日常里。<span>收集片刻共鸣，也留一扇重读的窗。</span></p><div class="stats"><span><strong id="book-total">0</strong>本书</span><span class="divider"></span><span><strong id="card-total">0</strong>段书摘</span></div></div>
      <div class="hero-art" aria-hidden="true"><span class="big">摘</span><span class="vertical">于字里行间</span><span class="vertical">拾一页清欢</span><span class="seal">拾忆</span></div>
    </section>
    <main class="library" id="library">
      <aside class="shelf" aria-label="按书籍筛选"><div class="shelf-heading">我的书架</div><div class="book-list" id="book-list"></div><p class="shelf-note">有些句子，<br>读过许久，<br>仍在心里轻轻回响。</p></aside>
      <section aria-labelledby="section-title">
        <div class="content-head"><div class="content-title"><h2 id="section-title">书页里的回声</h2><p id="section-subtitle">每一段，都是阅读留下的痕迹</p></div><label class="search-box"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索句子、书名或作者" aria-label="搜索句子、书名或作者"></label></div>
        <div class="filters"><select id="chapter-filter" aria-label="按章节筛选"><option value="">全部章节</option></select><select id="source-filter" aria-label="按划线来源筛选"><option value="">全部来源</option><option value="personal">我的划线</option><option value="popular">热门划线</option></select><span class="result-count" id="result-count" aria-live="polite"></span></div>
        <div class="cards" id="cards"></div><div class="load-more"><button class="btn" id="load-more" hidden>继续浏览</button></div>
      </section>
    </main>
    <footer class="footer"><span>拾忆碎笔 · 于书页间，留一点时光</span><span id="updated">由我挑选，与你分享</span></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-title">
    <div class="share-inner">
      <div class="share-heading"><div><h2 id="share-title">书摘分享卡片</h2><p>让这一句，成为值得收藏的一页。</p></div><button class="share-close" id="share-close" type="button" aria-label="关闭分享卡片">×</button></div>
      <div class="share-options"><label>卡片风格 <select id="share-theme"><option value="sky">晴空蓝</option><option value="paper">纸页米白</option><option value="forest">墨绿书笺</option></select></label><label class="share-note-option" id="share-note-option" hidden><input type="checkbox" id="share-note">附上我的阅读感想</label></div>
      <div class="share-preview-wrap" id="share-preview-wrap"><p class="share-loading" id="share-loading" role="status">正在生成卡片…</p><img class="share-preview" id="share-preview" alt="当前书摘的分享图片预览" hidden></div>

  <script type="application/json" id="reading-data">{"format":"reading-cards","version":1,"updatedAt":"2026-10-12T13:15:36+00:00","cards":[{"id":"784e9c65faa3bd0b6672a63c","book":"黄金时代","author":"王小波","chapter":"黄金时代 → 二","text":"那一天我二十一岁，在我一生的黄金时代，我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。后来我才知道，生活就是个缓慢受槌的过程，人一天天老下去，奢望也一天天消失，最后变得像挨了槌的牛一样。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"bd3b65d0f24dc3f12f163111","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十二","text":"在我的记忆之中，有一朵紫罗兰熠熠生辉。这轻狂的姑娘！我竟未染指！！妈的，我好不后悔！！！","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"ba3b31c038e7330ef5fd5b88","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十二","text":"王二，你病啦！小鸡鸡肿到这个样子，快上医院看看吧！","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"4800b4ef5082cedf132bfde4","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十一","text":"我说过，在似水流年里，有一些事叫我日夜不安。就是这些事：贺先生死了，死时直挺挺；刘老先生死了，死前想吃一只鸭；我在美国时，我爸爸也死了，死在了书桌上，当时他在写一封信，要和我讨论相对论。虽然死法各异，但每个人身上都有足以让他们再活下去的能量。我真希望他们得到延长生命的机会，继续活下去。我自己也再不想掏出肠子挂在别人脖子上。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"895cfc8927798453e750969f","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十一","text":"不准乱闹！你是哪单位的？我找你们领导！我说：你们他妈的找去！老子是知青！那人一听又缩了回去，知道全是亡命之徒，谁也不敢惹。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"be8537a61e4e301b4c332801","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十","text":"假如我死了，有人拿我的四分之一火葬，四分之一土葬，四分之一天葬，四分之一做木乃伊，我也有此疑问。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"7873492cb41c695b88ad9539","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二十","text":"人老了就像小孩一样，此话不虚。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"a15acc0ad5b785576dcba0b2","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十八","text":"时隔二十年后，我也到了不惑之年。对刘老先生的棋力我有这样的看法：他的棋并不坏。和我爸下，一晚能下二十盘，那是因为我爸的棋太臭。而和我下时，假如我告诉他：他输棋是因为走了怯着，他可以多支持些时候。我当时能知道这些道理，但是我一心要和小转铃做爱，所以想快点打发他走。假如我能知道他第二天就要死了，真该把做爱的事缓缓，在棋盘上给他点机会。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"36ed5aa32f083033afe3f24a","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十七","text":"在酷刑中勃起，在屠刀下性交，在临终时咒骂和射精，就是我从小盼望的事。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"d1c94ca34f1a72972dbebc69","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十六","text":"似水流年是一个人所有的一切，只有这个东西，才真正归你所有。其余的一切，都是片刻的欢娱和不幸，转眼间就已跑到那似水流年里去了。我所认识的人，都不珍视自己的似水流年。他们甚至不知道，自己还有这么一件东西，所以一个个像丢了魂一样。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"0a0fd4d47a99f0e3970faf18","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十六","text":"谈到自己身上发生过的事。这些事看起来就如一个人中了邪躺在河底，眼看潺潺流水，粼粼流光，落叶，浮木，空玻璃瓶，一样一样从身上流过去","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"bee6463e14b942e28d0fe05d","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十五","text":"因为有过上述经历，那天李先生听了这话，马上就反应过来了。他直言不讳地说：咱们做爱吧。线条一听，小脸挣得通红，厉声说：你倒真不傻！然后想了想，又说：那就做吧。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"03194641fa4f1e1c32736c29","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十三","text":"。然后她就研究起李先生来。第一个研究成果是：李先生是招风耳。第二个研究成果是：李先生的毛孔里都是煤。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"c057ec75c73f2772d3b7746b","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十三","text":"有人对线条有了拍拖之心，就上前纠缠。线条嫣然一笑，展开手中的折扇。扇面上有极好的两个隶字（我写的——王二注），“有主”！那时是二十二年前，线条是个清丽脱俗的小姑娘，笑起来很好看。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"e80a93339b671706b578d02d","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十二","text":"虽然人皆有好色之心，但是被冷风一吹，李先生的这种心就没了。他想的只是：我要是不去，那女孩子会伤心。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"362adba5e61814e2505e6534","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十一","text":"她说不为什么，只不过是因为早就下了决心，除龟头血肿，一辈子不和别的男人睡觉","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"55f695de7dbc6f4fe220f11f","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十一","text":"我亲爱的大龟头：我很想你。你也想我吗？——线条。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"af2ca7b842c6dd38f0349188","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十一","text":"龟头血肿，我爱你！——线条。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"a531cb5669a1d7f44e62b3cf","book":"黄金时代","author":"王小波","chapter":"似水流年 → 十","text":"然而岁月如流，一切都已发生过了。发生过的事再也没有改变的余地。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"31adc2c90808d7613a091f2c","book":"黄金时代","author":"王小波","chapter":"似水流年 → 八","text":"有关贺先生直了的事，我还有一点补充。不管他是在什么时候直了的，都只说明一件事：在贺先生身上，还有很多的生命力。别的什么都不说明。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"ec0c4e36f6612764edffe812","book":"黄金时代","author":"王小波","chapter":"似水流年 → 七","text":"堂堂一个doctor，居然会为了争东西和人打起来，而这些东西居然是些屎，shit！回到大陆来，保卫东，保卫西，最后保卫大粪。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"9615eb390ad63754ff5e6b82","book":"黄金时代","author":"王小波","chapter":"似水流年 → 七","text":"附近的农民老来偷粪，如果遇上了，一定要扭住，看看谁在干这不屙而获的事。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"79ea2d3b88699174c35041bd","book":"黄金时代","author":"王小波","chapter":"似水流年 → 六","text":"验尸时看见，贺先生那杆大枪又粗又长，完全竖起来了。假如在做爱前想起这件事，就会欲念全消，一点不想干。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"48deec3ddb12a1449bd4afb5","book":"黄金时代","author":"王小波","chapter":"似水流年 → 六","text":"当地农村之活计有所谓四大累之说，乃是：打井，脱坯，拔麦子，操屄。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"748d2716721dfda9573dec09","book":"黄金时代","author":"王小波","chapter":"似水流年 → 四","text":"龟头血肿，坚持住！我爱你！我想，哥们儿，你活着不容易。让我婆子爱爱你也无所谓。谁知到后来弄假成真，线条真成了龟头夫人！","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"ce31be09148d600f95163d00","book":"黄金时代","author":"王小波","chapter":"似水流年 → 三","text":"在我心中，他永远是那个造成了万人空巷争睹围观的伟大场面的人。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"c5dabe0f17bd196bf961caed","book":"黄金时代","author":"王小波","chapter":"似水流年 → 三","text":"一个人宁可叫自己思想的器官混入别人鞋底的微尘，这种气魄实出我想象之外。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"a739cfb68485aa30200fe46e","book":"黄金时代","author":"王小波","chapter":"似水流年 → 二","text":"那些日子里北京上空充满了阴霾，像一口冻结了的黏痰，终日不散。矿院死了好几个人，除贺先生跳楼，还有上吊的，服毒的，拿剪子把自己扎死的，叫人目不暇接。李先生的事，只是好笑而已，算不了大事情。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"4173935c5c19ea38ddbe5279","book":"黄金时代","author":"王小波","chapter":"似水流年 → 一","text":"现在我们院的人都在背后叫李先生龟头血肿，包括那些没结婚的小姑娘。她们说，李先生原是日本人，姓龟头，名血肿。这是不对的。李先生从未到过日本","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"5b10cc2724354377eb7c44f7","book":"黄金时代","author":"王小波","chapter":"三十而立 → 七","text":"但是只要我还在走动，就超越了死亡。现在我是诗人。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"c8b9f8f1a10356a343e8e7a3","book":"黄金时代","author":"王小波","chapter":"三十而立 → 七","text":"他和个陌生女孩待在一起，不好意思了，就这么说：“父母之命，媒妁之言……”你看他多干净，其实过一会儿，他就要操人家","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"1858dce65b969b5e2549782c","book":"黄金时代","author":"王小波","chapter":"三十而立 → 六","text":"照你这么说，我还真得去了。我爸爸病了，我要去陪，我妈还说用不着我。这老姚算个什么东西，居然要抢我爸爸上风！他拉屎我还要给他擦屁股，真跌份儿！我什么时候去？”","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"02dbbbac6ad616407053b5cc","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"写诗乃是我的大秘密，这种经历与性爱相仿：灵感来临时就如高潮，写在纸上就如射精，只有和我有性关系的女人才能看，怎么能叫我妈见到？我顿时觉得自己成了煺毛的鸡连个遮屁眼的东西都没有了。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"7ea022e459ee24e9bedc37e1","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"我妈妈始终爱我。她对小转铃说，人生是一条寂寞的路，要有一本有趣的书来消磨旅途。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"437aaa8bed743be49afd9abf","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"你自己爱干啥就干啥，首先要当个正直的人，其次要当个快乐的人。什么走正路，争头名，咱们不干这事，你是我的儿子！”","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"d900fb52d99515bc466b3587","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"他老想证明我一文不值。我说我真一文不值，他还是不干，真不知怎么才能让他满意。他想证明我不如他的一根鸡巴毛。这有什么？三十几年前我还是他射出的一个精虫哩……","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"2d3bf4c5785d1744f688412b","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"也许就是因为灌过凉水，我做噩梦时老梦见发大水；也许就是因为灌过凉水，我还早产了两个月，我出世时软塌塌、毛茸茸，像个在泔水桶里淹死的耗子。我妈妈见了就哭，长叹一声道：“我的妈！生出了个什么东西！”","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"5ebf971767cb385b1f9b6ccf","book":"黄金时代","author":"王小波","chapter":"三十而立 → 五","text":"忽然我妈打电话来，叫我去吃午饭。这是必须要去的。不然她生我这儿子干吗？我立刻就上路。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"9777a8ffc77eaf25e111a7ee","book":"黄金时代","author":"王小波","chapter":"三十而立 → 四","text":"这就是说，诗人这个行当应该取消，每个人都要做自己的诗人。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"0c42199229f9c45e1c0a57ff","book":"黄金时代","author":"王小波","chapter":"三十而立 → 四","text":"我一步步走进星星的万花筒。没有人能告诉我我在何处，没人能告诉我我是什么人，直到入睡，我心里还带着一丝迷惘","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"57461e6b1a98f4c93969014d","book":"黄金时代","author":"王小波","chapter":"三十而立 → 四","text":"像筛子筛麦粉，星星的眼泪在洒落","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"38d1766365e155ecad3bd668","book":"黄金时代","author":"王小波","chapter":"三十而立 → 四","text":"在会场上的感觉，就如睾丸叫人捏住了一样","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"e8a533a795fe8335f27da11f","book":"黄金时代","author":"王小波","chapter":"三十而立 → 三","text":"老师，甲班人说配种站里有头驴，看上去有五条腿，中间一条比其他的长五倍。他们吹牛吧？","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"92c18c99fb780d4e274ffb04","book":"黄金时代","author":"王小波","chapter":"三十而立 → 三","text":"有一点不明白。你这么盯着我干吗？”“这话怪了。我是关心你，爱护你。”“你关心我干吗？”","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"5792e3396969b8f2c1a3c2a1","book":"黄金时代","author":"王小波","chapter":"三十而立 → 三","text":"知道了。下次上您这儿来，就像和遗体告别。还有呢？”","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"1da69202101b84a0e838b9c7","book":"黄金时代","author":"王小波","chapter":"三十而立 → 二","text":"小转铃就坐在面前，上身戴个虎纹乳罩，下身穿了条短裙，在月光下显得很漂亮。我还发现她穿了耳朵眼，不过这没有用。她的鞋尖还是一塌糊涂，这说明她走路时还是要踢石子。这就叫江山易改本性难移。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"725c4cdd6c6f301885ef0567","book":"黄金时代","author":"王小波","chapter":"三十而立 → 二","text":"没人能得到小转铃，她是她自己的。这个女人勇悍绝伦，比我还疯狂。我和她初次做爱时，她流了不少血，涂在我们俩的腿上。不过片刻她就跳起来，嬉笑着对我说：王二，不要脸！这么大的东西就往这里杵！","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"10f6f344e054125723fdce98","book":"黄金时代","author":"王小波","chapter":"三十而立 → 二","text":"我要抱着草长马发情的伟大真诚去做一切事，而不是在人前羞羞答答地表演。在我看来，人都是为了要表演，失去了自己的存在。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"4253673ccaba3af4d578759c","book":"黄金时代","author":"王小波","chapter":"三十而立 → 二","text":"存在本身有无穷的魅力，为此值得把虚名浮利全部放弃。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"e2891c3789c8869f86d06e28","book":"黄金时代","author":"王小波","chapter":"黄金时代 → 十一","text":"陈清扬说，那一刻她感到浑身无力，就瘫软下来，挂在我肩上。那一刻她觉得如春藤绕树，小鸟依人。她再也不想理会别的事，而且在那一瞬间把一切都遗忘。在那一瞬间她爱上了我，而且这件事永远不能改变。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"6757e008f70fe7c82afa51b8","book":"黄金时代","author":"王小波","chapter":"黄金时代 → 十一","text":"这就是说，她那破裂的处女膜长了起来。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"081412656cb8a5cd9f91725e","book":"黄金时代","author":"王小波","chapter":"黄金时代 → 十","text":"但是我在深山里在她屁股上打了两下，彻底玷污了她的清白。","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"e5a4e1b6d105edf2c09f64f0","book":"黄金时代","author":"王小波","chapter":"黄金时代 → 四","text":"无论是经典的传教士式，后进式，侧进式，女上位，我都能一丝不苟地完成","source":"personal","collection":"《黄金时代》｜阅读书摘","note":""},{"id":"ae0189028969c3cb114ca40b","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记 → 八","text":"“她说过，她小时候怕黑，肯定想带一把手电。”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"1c4b90c8a57c949af66d6ec1","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记 → 八","text":"“妮，下次我再走的时候，就别再喊我了。娘一个月走不动道，身子是太沉了。刚才到了梦里，我走呀走呀，走到一个河边，腿突然就轻了。河边有花有草，我说，好长时间没洗脸了，蹲这河边洗把脸吧。刚要洗脸，听到你喊我，就又回来了；一回来，又躺在这病床上。妮，下次娘走的时候，就不要再喊娘了；不是娘心狠，不是娘没话跟你说，实在是受不了了……”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"a2e754650895bb09d9f2eb7a","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记 → 八","text":"当初把你嫁到沁源县觉得远，现在幸亏远。”曹青娥：“为啥？”老曹老婆：“因为远，我才能送你。”又说：“知道见你不容易，才想起这么多话。”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"8cd82152eb05d81f82e14871","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记 → 八","text":"“妮，咱再说点儿别的。”曹青娥：“说点儿别的就说点儿别的。”或曹青娥：“娘，咱再说点儿别的。”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"bdb45f3ff8a743d4b4cb5cbb","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记 → 七","text":"世上烦的就是这些亲人。论起共事，用谁，都比用他们好。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"ef9f5b0a7267df1c2851948d","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记","text":"爱不爱说话，原来也看跟谁在一起。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"11cc5de6307e58785e315c06","book":"一句顶一万句","author":"刘震云","chapter":"下部 回延津记","text":"五年之中，头两年两人还通信，后来渐渐淡了，后来渐渐断了","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"d685dfbf3dde37bdbf88c050","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十二","text":"巧玲哭了：“我想你了。明天该去白家庄拉面了。”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"fd5a88dff0f4d86fa38d7776","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十一","text":"“你不说实话，人在干东的时候，都在想西。​”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"19738ec16c66ae017996e6db","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十一","text":"与亲兄弟说不着，路上与朋友倒说得着。这时贩葱就不单是贩葱，还为个说得着。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"5df38f557b0bf534b7ea0c43","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十一","text":"姜虎平日不爱说话，也讨厌别人说废话。啥叫废话？说些已经过去的没用的事；啥叫有用的话？张罗些前面的有用的事","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"22cd633c91c8842134262b8c","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十","text":"杨摩西的弟弟杨百利，当年想通过上“新学”进县政府，路没有走通；谁知杨摩西没上“新学”，无意之中，舞一个社火，竟越过杨百利遂了心愿。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"015fc7e8cbc0f18e2629923e","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 十","text":"生活中他反对乱，但一个人扮成另一个人在街上舞，他觉得这不叫乱，恰恰是静。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"eb5e8ac88077c3cbefbe69dd","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 四","text":"儿啊，十里八乡皆为你贺，独我为你哭。","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"d0488246fbeb00f192b46c5c","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 三","text":"“东家，我也想算了，可心不由人呀。娃在时我也烦她，打她，现在她不在了，天天想她，光想见她。白天见不着，夜里天天梦她。梦里娃不淘了，站在床前，老说：‘爹，天冷了，我给你掖掖被窝。'”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"403f89cb421ecbf1b97961b6","book":"一句顶一万句","author":"刘震云","chapter":"上部 出延津记 → 三","text":"“贼就贼吧，我五十顷地，还养不起一个贼？”","source":"personal","collection":"《一句顶一万句》｜阅读书摘","note":""},{"id":"d1ea822d27b522ac9fc34163","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"口信","text":"三十年后，这姑娘成了严守一他奶。又四十六年后，严守一他奶去世，严守一跟她再说不上话。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"41730eda4042613c3121ced5","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"单位","text":"世界说起来很大，中国人说起来很多，但每个人迫切要处理和对付的，其实就身边周围那么几个人，相互琢磨的也就那么几个人。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"42f5575dc8e0dce8ea62ef7e","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"走了二里路，我向回看，李爱莲仍站在河堤上看我。她那身影，那被风吹起的衣襟，那身边的一棵小柳树，在蓝色中透着苍茫的天空中，在一抹血红的晚霞下，犹如一幅纸剪的画影。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"0ffd7c51b284ea12b565238f","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"新兵连","text":"没想到王滴听到这话，一口痰连糖吐出来，说：“‘共勉’个屎！三个月下来，一个个跟仇人似的，还‘共勉’！”","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"5c6db361ae1b85d818363d63","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"最后轮到我，我说：假如我像王全那样有了老婆，我不来复习；假如我像“耗子”那样正和一个姑娘谈恋爱，也不来复习；正是一无所有，才来复习。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"7667d673c167e4279fa8b84e","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"爹看着我们兴奋的样子，只“嘿嘿”地笑。这时我发现，爹的鞋帮已开了裂，裂口处，洇出一片殷红殷红的东西。我忙把爹的鞋扒下来，发现那满是脏土和皱皮的脚上，密密麻麻排满了血泡，有的已经破了，那是一只血脚。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"02212cd9dc1260810afd6cb1","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"官场","text":"金全礼说：“不，去春宫，看看老婆和孩子！”","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"d680c41c060b72e0357356c7","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"新兵连","text":"“这还不是对他的考验？上次没有发展他，指导员说他神色不对，就想出这么个点子。没想到一考验就考验出来了！”","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"21e5436c2913e59f2e09ca5c","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"单位","text":"只是令老何不解的是，老孙背后说了老张那么多坏话，现在却亲自把老张从二楼请回来参加处里的聚餐，并提议“为老领导干杯”。于是老何心里觉得老孙这人也不是东西。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"996fe1ebe8c5031a5d118ca5","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"土塬鼓点后：理查德·克莱德曼","text":"生活的意义是什么？就是企盼。企盼是什么？就是理想、猜想、梦想，永远得不到的水中的肉骨头。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"1375d92b2e1d0c1d1faa20ef","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"白混了：既没入党，也没提干，除了腮帮上钻出些密麻的胡子，和走时没啥两样。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"fd061028cb6c9a8b02e61762","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"新兵连","text":"“说是让我到军部当公务员，今天司机才告诉我，原来军长他爹瘫痪了，让我去给他端屎端尿！”王滴说着涌出两包泪。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"ccea5cf8562da21bf0944e0b","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"一地鸡毛","text":"我坐班车是沾了人家小姨子的光，没想到孩子进幼儿园，也是为了给人家陪读！”","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"d60f2d1e22207b22d6b310b1","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"一地鸡毛","text":"死的已经死了，再想也没有用，活着的还是先考虑大白菜为好。小林又想，如果收拾完大白菜，老婆能用微波炉再给他烤点鸡，让他喝瓶啤酒，他就没有什么不满足的了。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"20306d10b6fa87375c39bd81","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"单位","text":"可等吃过饭，双方都回到各自的车厢里，冷静下来，双方又都觉得刚才像一场表演，内心深处的东西，一点没有交流。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"ea2df4c7661bba924fce1677","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"第一次感到：劳动是幸福的。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"d7aba1396edb4f1fb269e386","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"头人","text":"大家吃饭以后，这时又开始生事。兄弟斗殴、婆媳吵架、孤老、破鞋、盗贼等一干杂事，又开始滋生。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"968769edaf3431b2021109e3","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"天是黑的，星是明的。密密麻麻的星，撒在无边无际的夜空闪烁。天是那么深邃，那么遥远。我第一次发现，我们头顶的天空，是那么崇高，那么宽广，那么仁慈和那么美。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"8442f9feb46a52074d7d3ef6","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"塔铺","text":"我不禁敬佩，满坑蛤蟆叫，就这一个是好学生。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""},{"id":"bb19be55616fef5b16d94509","book":"一地鸡毛（典藏版）","author":"刘震云","chapter":"一地鸡毛","text":"当天夜里，老婆孩子入睡，小林第一次流下了泪，还在漆黑的夜里扇了自己一耳光：“你怎么这么没本事，你怎么这么不会混！”但他扇的声音不大，怕把老婆弄醒。","source":"popular","collection":"《一地鸡毛（典藏版）》｜阅读书摘","note":""}],"mode":"public"}</script>
  <script>
    'use strict';
    (()=>{
      const $=id=>document.getElementById(id);
      const embedded=JSON.parse($('reading-data').textContent);
      const manage=embedded.mode==='manage';
      // 在任何 UI 改写之前保留干净模板，导出不包含管理界面的运行状态。
      const template='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      const storageKey='shiyi-reading-cards-v1';
      let cards=normalize(embedded).cards, selected=new Set(cards.map(c=>c.id));
      let book='',chapter='',query='',source='',limit=24,toastTimer;
      function text(value,max=200000){return typeof value==='string'?value.slice(0,max):'';}
      function normalize(data){
        if(!data||data.format!=='reading-cards'||data.version!==1||!Array.isArray(data.cards))throw new Error('请导入“导出网站选句”生成的 JSON，或本管理页的收藏备份。');
        if(data.cards.length>20000)throw new Error('单个收藏文件最多支持 20000 张卡片。');
        const clean=[],seen=new Set();
        for(const c of data.cards){
          if(!c||typeof c!=='object'||!text(c.text).trim()||!text(c.book).trim()||!text(c.id)||!['personal','popular'].includes(c.source))throw new Error('选句文件包含不完整的卡片，请重新导出。');
          const item={id:text(c.id,128),book:text(c.book,500),author:text(c.author,500),chapter:text(c.chapter,2000)||'章节未识别',text:text(c.text),source:c.source,collection:text(c.collection,1000),note:text(c.note,10000)};
          if(!seen.has(item.id)){clean.push(item);seen.add(item.id);}
        }
        return {format:'reading-cards',version:1,cards:clean};
      }
      function message(value){$('toast').textContent=value;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500);}
      function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;}
      function bookKey(c){return JSON.stringify([c.book,c.author]);}
      function persist(){if(!manage)return;try{localStorage.setItem(storageKey,JSON.stringify({format:'reading-cards',version:1,cards,selected:[...selected]}));}catch{message('浏览器未能记住收藏，请点击“备份收藏”保存到电脑。');}}
      function status(){if(!manage)return;const count=cards.filter(c=>selected.has(c.id)).length;$('manager-status').textContent=`收藏 ${cards.length} 张，准备发布 ${count} 张。生成页面后，将 index.html 放入博客 source/reading 文件夹，再按原来的流程发布。`;$('export-button').disabled=!count;$('backup-button').disabled=!cards.length;}
      function renderShelf(){
        const books=new Map();for(const c of cards){const key=bookKey(c);if(!books.has(key))books.set(key,{title:c.book,author:c.author,count:0});books.get(key).count++;}
        $('book-total').textContent=books.size;$('card-total').textContent=cards.length;$('book-list').replaceChildren();
        const add=(key,title,author,count)=>{const b=node('button','book-button'+(book===key?' selected':''));b.type='button';b.setAttribute('aria-pressed',String(book===key));const label=node('span','book-label');label.append(node('strong','',title));if(author)label.append(node('small','',author));b.append(label,node('span','book-count',count));b.addEventListener('click',()=>{book=key;chapter='';limit=24;renderShelf();renderChapters();render();});$('book-list').append(b);};
        add('','全部书摘','',cards.length);for(const [key,b]of books)add(key,b.title,b.author,b.count);
        if(book&&!books.has(book)){book='';chapter='';renderShelf();}
      }
      function renderChapters(){const options=[...new Set(cards.filter(c=>!book||bookKey(c)===book).map(c=>c.chapter))];$('chapter-filter').replaceChildren(new Option('全部章节',''));for(const label of options)$('chapter-filter').add(new Option(label,label));if(!options.includes(chapter))chapter='';$('chapter-filter').value=chapter;}
      function filtered(){const q=query.trim().toLocaleLowerCase();return cards.filter(c=>(!book||bookKey(c)===book)&&(!chapter||c.chapter===chapter)&&(!source||c.source===source)&&(!q||[c.text,c.book,c.author,c.chapter,c.collection,c.note].some(v=>v.toLocaleLowerCase().includes(q))));}
      async function copy(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);}else{const area=node('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error();}message('已复制');}catch{message('复制未成功，可以选中卡片文字后按 Ctrl+C。');}}
      function cardElement(c,index){
        const article=node('article','quote-card'+(manage&&!selected.has(c.id)?' unselected':''));article.id='card-'+encodeURIComponent(c.id);
        if(manage){const label=node('label','select-card');const input=document.createElement('input');input.type='checkbox';input.checked=selected.has(c.id);input.setAttribute('aria-label','发布选句：'+c.text.slice(0,25));input.addEventListener('change',()=>{if(input.checked)selected.add(c.id);else selected.delete(c.id);article.classList.toggle('unselected',!input.checked);persist();status();});label.append(input,document.createTextNode('加入公开页面'));article.append(label);}
        const top=node('div','card-top');top.append(node('span','card-index',String(index+1).padStart(2,'0')),node('span','chapter',c.chapter));article.append(top,node('blockquote','',c.text));
        const credit=node('div','attribution');credit.append(node('span','',c.author||'作者未标注'),node('span','dot','·'),node('span','',`《${c.book}》`));article.append(credit);
        if(c.note){const details=node('details','note');details.append(node('summary','','我的阅读感想'),node('div','',c.note));article.append(details);}
        const bottom=node('div','card-bottom');bottom.append(node('span','source'+(c.source==='popular'?' hot':''),c.source==='personal'?'我的划线':'热门划线 · 其他读者'));
        const controls=node('div','card-controls');const cb=node('button','icon-button','复制');cb.type='button';cb.setAttribute('aria-label','复制这段书摘');cb.addEventListener('click',()=>copy(`${c.text}\n— ${c.author}《${c.book}》\n${c.chapter}`));controls.append(cb);
        const share=node('button','icon-button share-card-button','生成分享卡片');share.type='button';share.setAttribute('aria-label','生成这段书摘的分享卡片');share.addEventListener('click',()=>openShare(c));controls.append(share);
        if(manage){const remove=node('button','icon-button','移除');remove.type='button';remove.setAttribute('aria-label','移除这张卡片');remove.addEventListener('click',()=>{cards=cards.filter(x=>x.id!==c.id);selected.delete(c.id);persist();renderAll();message('已从本地收藏移除。已发布的网站需重新生成、发布后更新。');});controls.append(remove);}else{const link=node('a','icon-button','定位');link.href='#'+article.id;link.setAttribute('aria-label','定位这张卡片');controls.append(link);}
        bottom.append(controls);article.append(bottom);return article;
      }
      function render(){
        const results=filtered();$('cards').replaceChildren();const current=cards.find(c=>bookKey(c)===book);$('section-title').textContent=current?current.book:'书页里的回声';$('section-subtitle').textContent=current?`${current.author||'作者未标注'} · 在字句间重新相遇`:'每一段，都是阅读留下的痕迹';$('result-count').textContent=`${results.length} 段书摘`;
        if(!results.length){const empty=node('div','empty');empty.append(node('strong','',cards.length?'暂未找到这一句':'书架静候下一次阅读'),node('p','',cards.length?'换一个关键词，或试试其他书籍与章节。':manage?'从阅迹导入挑选好的网站选句，开始收集。':'这里将陆续分享我挑选的书摘。'));$('cards').append(empty);}else{for(let i=0;i<Math.min(limit,results.length);i++)$('cards').append(cardElement(results[i],i));}
        $('load-more').hidden=results.length<=limit;status();
      }
      function renderAll(){renderShelf();renderChapters();render();}
      function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=node('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
      const cardFont='"Shiyi WenKai", "STKaiti", "KaiTi", "Songti SC", "SimSun", serif';
      const shareThemes={
        sky:{background:'#dceef9',paper:'#f5fbff',ink:'#294e68',muted:'#65869c',line:'#b8d5e8',accent:'#4f7d9c',wash:'#c2dfef'},
        paper:{background:'#eae2d4',paper:'#fffaf0',ink:'#524333',muted:'#93816b',line:'#ddcfb8',accent:'#967750',wash:'#eadbc2'},
        forest:{background:'#193b34',paper:'#f1f5eb',ink:'#2f4c3c',muted:'#73856c',line:'#c1cfb6',accent:'#517455',wash:'#d7e4cb'}
      };
      let shareCard=null,shareBlob=null,shareURL='',sharePages=[],sharePage=0,shareVersion=0,shareTrigger=null;
      function roundBox(ctx,x,y,width,height,radius){ctx.beginPath();ctx.roundRect(x,y,width,height,radius);}
      function cardLines(ctx,value,size,width){
        ctx.font=`${size}px ${cardFont}`;
        const result=[],widths=new Map();
        const measure=char=>{if(!widths.has(char))widths.set(char,ctx.measureText(char).width);return widths.get(char);};
        const segments=typeof Intl.Segmenter==='function'?new Intl.Segmenter('zh-CN',{granularity:'grapheme'}):null;
        for(const paragraph of value.replace(/\r\n?/g,'\n').split('\n')){
          let line=[],used=0;
          const chars=segments?[...segments.segment(paragraph)].map(part=>part.segment):Array.from(paragraph);
          for(const char of chars){
            const next=measure(char);
            if(line.length&&used+next>width){
              if(/^[，。！？；：、）】》」』…,.!?;:]$/.test(char)&&line.length>1){const last=line.pop();result.push(line.join(''));line=[last];used=measure(last);}
              else{result.push(line.join(''));line=[];used=0;}
            }
            line.push(char);used+=next;
          }
          result.push(line.join(''));
        }
        return result;
      }
      function shortLines(ctx,value,size,width,count){const lines=cardLines(ctx,value,size,width);if(lines.length>count){const last=Array.from(lines[count-1]);while(last.length&&ctx.measureText(last.join('')+'…').width>width)last.pop();lines[count-1]=last.join('')+'…';}return lines.slice(0,count);}
      function prepareSharePages(card,withNote){
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        if(!ctx)throw new Error('这个浏览器无法生成图片，请换一个浏览器重试。');
        const rows=cardLines(ctx,card.text,42,860).map(value=>({value,size:42,height:72,kind:'quote'}));
        if(withNote&&card.note){rows.push({value:'我的阅读感想',size:27,height:72,kind:'heading'});rows.push(...cardLines(ctx,card.note,30,860).map(value=>({value,size:30,height:50,kind:'note'})));}
        const pages=[];let page=[],height=0;
        for(const row of rows){if(page.length&&height+row.height+(row.kind==='heading'?50:0)>1512){pages.push(page);page=[];height=0;if(row.kind==='note'){page.push({value:'我的阅读感想（续）',size:27,height:72,kind:'heading'});height=72;}}page.push(row);height+=row.height;}if(page.length)pages.push(page);
        return pages;
      }
      function drawShare(card,rows,index,total){
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),theme=shareThemes[$('share-theme').value]||shareThemes.sky;
        const title=shortLines(ctx,`《${card.book}》`,34,860,2),author=shortLines(ctx,card.author||'作者未标注',28,860,2),chapter=shortLines(ctx,card.chapter,23,860,3);
        const contentHeight=rows.reduce((sum,row)=>sum+row.height,0),footerHeight=title.length*46+author.length*38+chapter.length*32+130;
        canvas.width=1080;canvas.height=Math.max(1080,280+contentHeight+70+footerHeight+90);
        ctx.fillStyle=theme.background;ctx.fillRect(0,0,canvas.width,canvas.height);
        const wash=ctx.createLinearGradient(0,0,1080,canvas.height);wash.addColorStop(0,theme.paper);wash.addColorStop(1,theme.paper);
        ctx.fillStyle=wash;roundBox(ctx,36,36,1008,canvas.height-72,24);ctx.fill();
        ctx.save();roundBox(ctx,36,36,1008,canvas.height-72,24);ctx.clip();ctx.globalAlpha=.25;ctx.fillStyle=theme.wash;ctx.beginPath();ctx.arc(1045,20,340,0,Math.PI*2);ctx.fill();ctx.restore();
        ctx.strokeStyle=theme.line;ctx.lineWidth=1.5;roundBox(ctx,56,56,968,canvas.height-112,16);ctx.stroke();
        ctx.textBaseline='top';ctx.fillStyle=theme.accent;ctx.font=`28px ${cardFont}`;ctx.fillText('拾忆碎笔',110,105);
        ctx.font='17px Georgia, serif';ctx.fillStyle=theme.muted;ctx.fillText('R E A D I N G   N O T E S',110,149);
        ctx.strokeStyle=theme.line;roundBox(ctx,906,97,60,66,4);ctx.stroke();ctx.font=`34px ${cardFont}`;ctx.fillStyle=theme.accent;ctx.fillText('摘',919,108);
        ctx.fillStyle=theme.line;ctx.font='120px Georgia, serif';ctx.fillText('“',98,202);
        let y=280;
        for(const row of rows){ctx.font=`${row.size}px ${cardFont}`;ctx.fillStyle=row.kind==='quote'?theme.ink:theme.muted;if(row.kind==='heading'){ctx.strokeStyle=theme.line;ctx.beginPath();ctx.moveTo(110,y+8);ctx.lineTo(970,y+8);ctx.stroke();ctx.fillText(row.value,110,y+30);}else ctx.fillText(row.value,110,y);y+=row.height;}
        y+=52;ctx.strokeStyle=theme.line;ctx.beginPath();ctx.moveTo(110,y);ctx.lineTo(970,y);ctx.stroke();y+=36;
        ctx.fillStyle=theme.ink;ctx.font=`34px ${cardFont}`;for(const line of title){ctx.fillText(line,110,y);y+=46;}
        ctx.fillStyle=theme.muted;ctx.font=`28px ${cardFont}`;for(const line of author){ctx.fillText(line,110,y);y+=38;}y+=13;
        ctx.font=`23px ${cardFont}`;for(const line of chapter){ctx.fillText(line,110,y);y+=32;}y+=17;
        ctx.font=`21px ${cardFont}`;ctx.fillText(card.source==='personal'?'我的微信读书划线':'热门划线 · 其他读者',110,y);
        ctx.font=`20px ${cardFont}`;ctx.fillStyle=theme.muted;ctx.fillText('于书页间，留一点时光',110,canvas.height-121);
        ctx.textAlign='right';ctx.font='18px Georgia, serif';ctx.fillText(total>1?`${index+1} / ${total}  ·  ki11yy.github.io`:'ki11yy.github.io',970,canvas.height-118);
        return canvas;
      }
      function shareFilename(){const book=(shareCard.book||'书摘').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').slice(0,50);return `${book}_书摘${sharePages.length>1?'_'+(sharePage+1):''}.png`;}
      function setShareBusy(){shareBlob=null;$('share-download').disabled=true;$('share-native').hidden=true;$('share-previous').disabled=true;$('share-next').disabled=true;$('share-preview').hidden=true;$('share-loading').hidden=false;$('share-loading').textContent='正在生成卡片…';}
      async function renderShare(){
        const version=++shareVersion;setShareBusy();
        try{
          const canvas=drawShare(shareCard,sharePages[sharePage],sharePage,sharePages.length);
          const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('图片生成失败，请重试。')),'image/png'));
          if(version!==shareVersion||!$('share-dialog').open)return;
          const previous=shareURL;shareURL=URL.createObjectURL(blob);shareBlob=blob;$('share-preview').src=shareURL;if(previous)URL.revokeObjectURL(previous);
          $('share-preview').alt=`《${shareCard.book}》书摘分享卡片${sharePages.length>1?'，第 '+(sharePage+1)+' 张':''}`;
          $('share-preview').hidden=false;$('share-loading').hidden=true;$('share-download').disabled=false;
          $('share-pages').hidden=sharePages.length<2;$('share-page-number').textContent=`第 ${sharePage+1} / ${sharePages.length} 张`;
          $('share-previous').disabled=sharePage===0;$('share-next').disabled=sharePage===sharePages.length-1;
          $('share-download').textContent=sharePages.length>1?'下载当前卡片':'下载 PNG 图片';
          $('share-hint').textContent=`高清 PNG · ${canvas.width} × ${canvas.height} 像素。${sharePages.length>1?'长书摘已分为 '+sharePages.length+' 张，切换后可逐张保存。':'手机上也可长按预览图片保存。'}`;
          let canShare=false;try{const file=new File([blob],shareFilename(),{type:'image/png'});canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch{}$('share-native').hidden=!canShare;
        }catch(error){if(version===shareVersion){$('share-loading').textContent=error.message||'卡片生成失败，请重试。';}}
      }
      async function refreshShare(){
        const version=++shareVersion;sharePages=[];setShareBusy();
        try{if(document.fonts){const sample=(shareCard.text+shareCard.book+shareCard.author+shareCard.chapter+($('share-note').checked?shareCard.note:'')).slice(0,6000);await document.fonts.load(`42px "Shiyi WenKai"`,sample).catch(()=>{});}
          if(version!==shareVersion||!$('share-dialog').open)return;sharePages=prepareSharePages(shareCard,$('share-note').checked);sharePage=0;await renderShare();
        }catch(error){if(version===shareVersion)$('share-loading').textContent=error.message||'卡片生成失败，请重试。';}
      }
      function openShare(card){shareCard=card;sharePages=[];shareTrigger=document.activeElement;$('share-note').checked=false;$('share-note-option').hidden=!card.note;$('share-pages').hidden=true;$('share-dialog').showModal();document.body.style.overflow='hidden';refreshShare();}
      $('share-close').addEventListener('click',()=>$('share-dialog').close());
      $('share-dialog').addEventListener('close',()=>{++shareVersion;shareBlob=null;if(shareURL)URL.revokeObjectURL(shareURL);shareURL='';$('share-preview').removeAttribute('src');document.body.style.overflow='';if(shareTrigger&&shareTrigger.isConnected)shareTrigger.focus();});
      $('share-dialog').addEventListener('click',event=>{if(event.target===$('share-dialog')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.target.close();}});
      $('share-theme').addEventListener('change',()=>{if(sharePages.length)renderShare();});$('share-note').addEventListener('change',refreshShare);
      $('share-previous').addEventListener('click',()=>{if(sharePage>0){--sharePage;renderShare();}});$('share-next').addEventListener('click',()=>{if(sharePage<sharePages.length-1){++sharePage;renderShare();}});
      $('share-download').addEventListener('click',()=>{if(shareBlob){download(shareBlob,shareFilename(),'image/png');message('书摘图片已生成，若手机未下载，可长按预览图片保存。');}});
      $('share-native').addEventListener('click',async()=>{if(!shareBlob)return;try{await navigator.share({title:`《${shareCard.book}》书摘`,files:[new File([shareBlob],shareFilename(),{type:'image/png'})]});}catch(error){if(error.name!=='AbortError')message('分享未成功，请下载图片后分享。');}});
      function safeJSON(data){return JSON.stringify(data).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');}
      function publicHTML(chosen){
        const doc=new DOMParser().parseFromString(template,'text/html');
        for(const id of ['manager','manage-selection','demo-notice'])doc.getElementById(id).remove();
        doc.getElementById('reading-data').textContent=safeJSON({format:'reading-cards',version:1,mode:'public',updatedAt:new Date().toISOString(),cards:chosen});
        return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
      }
      $('search').addEventListener('input',e=>{query=e.target.value;limit=24;render();});$('chapter-filter').addEventListener('change',e=>{chapter=e.target.value;limit=24;render();});$('source-filter').addEventListener('change',e=>{source=e.target.value;limit=24;render();});$('load-more').addEventListener('click',()=>{limit+=24;render();});
      if(manage){
        $('manager').hidden=false;$('manage-selection').hidden=false;
        try{const stored=JSON.parse(localStorage.getItem(storageKey));if(stored){cards=normalize(stored).cards;selected=new Set(Array.isArray(stored.selected)?stored.selected:cards.map(c=>c.id));}}catch{message('未能读取上次收藏，请导入备份恢复。');}
        $('import-button').addEventListener('click',()=>$('import-file').click());
        $('import-file').addEventListener('change',async e=>{const files=[...e.target.files];let incoming=[];try{for(const file of files){if(file.size>20000000)throw new Error('选句文件超过 20 MB，请分批导入。');const data=JSON.parse(await file.text());const checked=Array.isArray(data.selected)?new Set(data.selected):null;incoming.push(...normalize(data).cards.map(card=>({card,checked:!checked||checked.has(card.id)})));}const merged=new Map(cards.map(c=>[c.id,c]));const nextSelected=new Set(selected);let added=0;for(const item of incoming){const c=item.card;if(!merged.has(c.id)){merged.set(c.id,c);if(item.checked)nextSelected.add(c.id);added++;}else if(c.source==='personal'||merged.get(c.id).source!=='personal'){merged.set(c.id,c);}}if(merged.size>20000)throw new Error('收藏超过 20000 张，请分成多个栏目。');cards=[...merged.values()];selected=nextSelected;persist();renderAll();message(`导入完成：新增 ${added} 张，相同卡片自动合并。`);}catch(err){message(err instanceof SyntaxError?'文件不是有效 JSON，请重新导出网站选句。':err.message);}finally{e.target.value='';}});
        $('select-visible').addEventListener('click',()=>{for(const c of filtered())selected.add(c.id);persist();render();});$('deselect-visible').addEventListener('click',()=>{for(const c of filtered())selected.delete(c.id);persist();render();});
        $('backup-button').addEventListener('click',()=>download(JSON.stringify({format:'reading-cards',version:1,updatedAt:new Date().toISOString(),cards,selected:[...selected]},null,2),'阅读卡片收藏备份.json','application/json;charset=utf-8'));
        $('export-button').addEventListener('click',()=>{const chosen=cards.filter(c=>selected.has(c.id));if(!chosen.length){message('请先勾选准备公开的卡片。');return;}download(publicHTML(chosen),'index.html','text/html;charset=utf-8');message(`已生成 ${chosen.length} 张公开卡片。下载完成后可双击 index.html 检查；发布到博客后访客才能看到。`);});
      }else if(embedded.updatedAt){const date=new Date(embedded.updatedAt);if(!Number.isNaN(date.getTime()))$('updated').textContent='最近整理 · '+date.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});}
      if(embedded.mode==='demo')$('demo-notice').hidden=false;
      renderAll();
      if(location.hash.startsWith('#card-')){const id=location.hash.slice(6);const i=cards.findIndex(c=>encodeURIComponent(c.id)===id);if(i>=0){limit=Math.max(limit,i+1);render();requestAnimationFrame(()=>document.getElementById('card-'+id)?.scrollIntoView({block:'center'}));}}
    })();
  </script>
</body>
